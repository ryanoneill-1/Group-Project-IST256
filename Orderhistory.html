<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Order History – Student Club Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link rel="stylesheet" href="Finalizestyle.css">
</head>
<body>

    <header>
        <h1>Order History</h1>
        <p>View all your submitted event registrations and their status</p>
    </header>

    <nav class="topnav">
        <ul>
            <li><a href="index.html">Homepage</a></li>
            <li><a href="Registration.html">Student Registration</a></li>
            <li><a href="Events.html">Club Events</a></li>
            <li><a href="ShoppingCart.html">Shopping Cart</a></li>
            <li><a href="Storefront.html">Storefront</a></li>

            <li><a href="Finalize.html">Finalize</a></li>
            <li><a class="active" href="OrderHistory.html">Order History</a></li>
            <li><a href="Approval.html">Admin Approval</a></li>
        </ul>
    </nav>

    <main>
        <div id="react-root"></div>
    </main>

    <footer>
        <p><strong>© 2026 Student Club Portal. IST256 Group Project.</strong></p>
    </footer>

    <script type="text/babel">

        function StatusBadge({ status }) {
            const map = {
                pending:  { cls: "badge bg-warning text-dark", label: "Pending"  },
                approved: { cls: "badge bg-success",           label: "Approved" },
                declined: { cls: "badge bg-danger",            label: "Declined" },
            };
            const { cls, label } = map[status] || { cls: "badge bg-secondary", label: status };
            return <span className={cls}>{label}</span>;
        }

        function OrderCard({ order }) {
            const [expanded, setExpanded] = React.useState(false);
            const events = order.finalizationOptions?.selectedEvents || [];
            const info   = order.registrant || {};

            return (
                <div className="order-card">
                    <div className="order-card-header">
                        <div className="order-id-row">
                            <span className="order-id">#{order.id}</span>
                            <StatusBadge status={order.status} />
                        </div>
                        <div className="order-meta-row">
                            <span>{info.firstName} {info.lastName}</span>
                            <span>{info.email}</span>
                            <span className="order-date">{new Date(order.createdAt).toLocaleString()}</span>
                        </div>
                    </div>

                    <div className="order-card-body">
                        <div className="order-attendance">
                            <strong>Attendance:</strong> {order.finalizationOptions?.attendanceType || "—"}
                        </div>
                        <div className="order-events-count">
                            <strong>{events.length}</strong> event{events.length !== 1 ? "s" : ""} registered
                        </div>
                        <button
                            className="btn-toggle"
                            onClick={() => setExpanded(p => !p)}>
                            {expanded ? "Hide Details ▲" : "Show Details ▼"}
                        </button>
                    </div>

                    {expanded && (
                        <div className="order-details">
                            {events.length === 0 ? (
                                <p className="text-muted" style={{fontSize:"0.85rem"}}>No events listed.</p>
                            ) : events.map((e, i) => (
                                <div key={i} className="detail-event-row">
                                    <span className="rev-badge">{e.category}</span>
                                    <span className="detail-title">{e.title}</span>
                                    <span className="detail-meta">{e.duration} · {e.location || "No location"}</span>
                                </div>
                            ))}
                            {order.finalizationOptions?.specialRequests && (
                                <div className="detail-notes">
                                    <strong>Notes:</strong> {order.finalizationOptions.specialRequests}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const [orders,  setOrders]  = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [error,   setError]   = React.useState("");
            const [filter,  setFilter]  = React.useState("all");

            const fetchOrders = () => {
                setLoading(true);
                setError("");
                $.ajax({
                    url: "http://localhost:3000/api/orders",
                    method: "GET",
                    success: function (data) {
                        setOrders(data);
                        setLoading(false);
                    },
                    error: function () {
                        setError("Could not connect to the server. Make sure server.js is running (node server.js).");
                        setLoading(false);
                    }
                });
            };

            React.useEffect(() => { fetchOrders(); }, []);

            const filtered = filter === "all"
                ? orders
                : orders.filter(o => o.status === filter);

            return (
                <div>
                    <div className="page-title">
                        <h2>Your Submission History</h2>
                        <p>All event registrations you have submitted are listed below.</p>
                    </div>

                    <div className="form-card">
                        <div className="history-toolbar">
                            <div className="filter-row">
                                {["all", "pending", "approved", "declined"].map(f => (
                                    <button
                                        key={f}
                                        className={`filter-btn ${filter === f ? "active" : ""}`}
                                        onClick={() => setFilter(f)}>
                                        {f.charAt(0).toUpperCase() + f.slice(1)}
                                    </button>
                                ))}
                            </div>
                            <button className="btn-refresh" onClick={fetchOrders}>↻ Refresh</button>
                        </div>

                        {loading && <p className="empty-cart-msg">Loading orders...</p>}

                        {error && (
                            <div className="alert alert-danger mt-3" style={{fontSize:"0.9rem"}}>
                                {error}
                            </div>
                        )}

                        {!loading && !error && filtered.length === 0 && (
                            <p className="empty-cart-msg">
                                No {filter !== "all" ? filter : ""} submissions found.{" "}
                                <a href="Finalize.html">Submit a registration</a> to see it here.
                            </p>
                        )}

                        {!loading && !error && filtered.map(order => (
                            <OrderCard key={order.id} order={order} />
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("react-root"));
        root.render(<App />);
    </script>
</body>
</html>
