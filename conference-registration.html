<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Session Registration – TechConf 2025</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>

  <!-- React + Babel (for JSX in browser) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- jQuery (for AJAX demo) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

 <link rel="stylesheet" href="Confstyle.css">
</head>
<body>

  <header>
    <h1>🎤 TechConf 2025</h1>
    <p>Annual Technology Conference &amp; Expo</p>
  </header>

  <nav class="tabs">
    <ul>
      <li><a class="active" href="Homepage.html">Homepage</a></li>
        <li><a href="Registration.html">Student Registration</a></li>
        <li><a href="Events.html">Club Events</a></li>
        <li><a href="ShoppingCart.html">Shopping Cart</a></li>
        <li><a href="Storefront.html">Storefront</a></li>
        <li><a href="conference-registration.html">Session Registration</a></li>
    </ul>
  </nav>

  <main>
    <div id="react-root"></div>
  </main>

  <footer>
    <p>&copy; 2025 TechConf. All rights reserved.</p>
  </footer>

  <!-- ═══════════════════════════════════════════
       REACT APPLICATION
  ═══════════════════════════════════════════ -->
  <script type="text/babel">

    // ── Data: available sessions (simulates data fetched via jQuery/AJAX) ──
    const AVAILABLE_SESSIONS = [
      { id:"s1", title:"Keynote: AI Frontiers",    time:"9:00 AM", track:"AI/ML",     room:"Hall A" },
      { id:"s2", title:"Web Dev in 2025",           time:"10:30 AM",track:"Web",       room:"Room 101" },
      { id:"s3", title:"Cloud Architecture",        time:"10:30 AM",track:"Cloud",     room:"Room 202" },
      { id:"s4", title:"Cybersecurity Essentials",  time:"1:00 PM", track:"Security",  room:"Room 303" },
      { id:"s5", title:"React & Modern Frontends",  time:"1:00 PM", track:"Web",       room:"Room 101" },
      { id:"s6", title:"Data Engineering at Scale", time:"2:30 PM", track:"Data",      room:"Room 404" },
      { id:"s7", title:"DevOps & CI/CD",            time:"2:30 PM", track:"DevOps",    room:"Room 202" },
      { id:"s8", title:"Closing Panel & Networking",time:"4:00 PM", track:"General",   room:"Hall A" },
    ];

    // ── Utilities ──
    const emptyForm = () => ({
      firstName: "", lastName: "", email: "", phone: "",
      company: "", participationType: "in-person",
      dietaryNeeds: "", accessibilityNeeds: "",
      sessions: [], shirtSize: "", agreeTerms: false,
    });

    // ── Main React App ──
    function App() {
      const [form,      setForm]      = React.useState(emptyForm());
      const [errors,    setErrors]    = React.useState({});
      const [submitted, setSubmitted] = React.useState(false);
      const [jsonDoc,   setJsonDoc]   = React.useState(null);
      const [ajaxMsg,   setAjaxMsg]   = React.useState({ text:"", cls:"" });
      const [sessionData, setSessionData] = React.useState(AVAILABLE_SESSIONS);

      // Simulate jQuery AJAX fetching sessions on mount
      React.useEffect(() => {
        // jQuery AJAX call to simulate fetching session data from a RESTful API
        // In production this would hit a real endpoint e.g. /api/sessions
        $.ajax({
          url: "https://jsonplaceholder.typicode.com/posts/1", // demo endpoint
          method: "GET",
          success: function() {
            // Sessions already loaded from local constant (demo uses static data)
            setSessionData(AVAILABLE_SESSIONS);
          },
          error: function() {
            setSessionData(AVAILABLE_SESSIONS); // fallback
          }
        });
      }, []);

      // ── Field change handler ──
      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        setForm(prev => ({ ...prev, [name]: type === "checkbox" ? checked : value }));
        if (errors[name]) setErrors(prev => ({ ...prev, [name]: "" }));
      };

      // ── Session toggle ──
      const toggleSession = (id) => {
        setForm(prev => {
          const already = prev.sessions.includes(id);
          return { ...prev, sessions: already
            ? prev.sessions.filter(s => s !== id)
            : [...prev.sessions, id] };
        });
        if (errors.sessions) setErrors(prev => ({ ...prev, sessions: "" }));
      };

      // ── JS Client-side Validation ──
      const validate = () => {
        const e = {};
        if (!form.firstName.trim())      e.firstName = "First name is required.";
        if (!form.lastName.trim())       e.lastName  = "Last name is required.";
        if (!form.email.trim())          e.email     = "Email is required.";
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email))
                                         e.email     = "Enter a valid email address.";
        if (form.phone && !/^\+?[\d\s\-().]{7,15}$/.test(form.phone))
                                         e.phone     = "Enter a valid phone number.";
        if (!form.participationType)     e.participationType = "Please select a participation type.";
        if (form.sessions.length === 0)  e.sessions  = "Select at least one session.";
        if (!form.shirtSize)             e.shirtSize = "Please select a shirt size.";
        if (!form.agreeTerms)            e.agreeTerms = "You must agree to the terms.";
        return e;
      };

      // ── Build JSON document ──
      const buildJson = () => {
        const selectedSessions = form.sessions.map(id =>
          sessionData.find(s => s.id === id)
        );
        return {
          submittedAt: new Date().toISOString(),
          registrant: {
            firstName: form.firstName,
            lastName:  form.lastName,
            email:     form.email,
            phone:     form.phone || null,
            company:   form.company || null,
          },
          conferenceOptions: {
            participationType: form.participationType,
            selectedSessions:  selectedSessions,
            shirtSize:         form.shirtSize,
            dietaryNeeds:      form.dietaryNeeds || null,
            accessibilityNeeds:form.accessibilityNeeds || null,
          },
          termsAgreed: form.agreeTerms,
        };
      };

      // ── Submit: validate → JSON → AJAX ──
      const handleSubmit = () => {
        const errs = validate();
        if (Object.keys(errs).length > 0) {
          setErrors(errs);
          // Scroll to first error
          const firstErrEl = document.querySelector(".field-error");
          if (firstErrEl) firstErrEl.scrollIntoView({ behavior:"smooth", block:"center" });
          return;
        }

        const doc = buildJson();
        setJsonDoc(doc);
        setAjaxMsg({ text: "⏳ Sending registration...", cls: "sending" });

        // ── AJAX via jQuery: POST JSON to RESTful API ──
        $.ajax({
          url: "https://jsonplaceholder.typicode.com/posts", // demo REST endpoint
          method: "POST",
          contentType: "application/json",
          data: JSON.stringify(doc),
          success: function(response) {
            setAjaxMsg({ text: "✅ Registration sent successfully! (Server ID: " + response.id + ")", cls: "success" });
            setSubmitted(true);
          },
          error: function(xhr) {
            setAjaxMsg({ text: "❌ Submission failed. Please try again. (" + xhr.status + ")", cls: "error" });
          }
        });
      };

      // ── Reset ──
      const handleReset = () => {
        setForm(emptyForm());
        setErrors({});
        setSubmitted(false);
        setJsonDoc(null);
        setAjaxMsg({ text:"", cls:"" });
      };

      // ── Render success state ──
      if (submitted) {
        return (
          <div>
            <div className="success-panel">
              <div style={{fontSize:"3rem"}}>🎉</div>
              <h4>Registration Confirmed!</h4>
              <p>Thank you, <strong>{form.firstName} {form.lastName}</strong>! Your spot is reserved.</p>
              <p>A confirmation will be sent to <strong>{form.email}</strong>.</p>
              <p className={`ajax-status ${ajaxMsg.cls}`}>{ajaxMsg.text}</p>
              <button className="btn-reset-site" onClick={handleReset}>Register Another</button>
            </div>

            
          </div>
        );
      }

      // ── Render form ──
      return (
        <div>
          <div className="page-title">
            <h2>Session Registration</h2>
            <p>Complete the form below to register for TechConf 2025 sessions.</p>
          </div>

          {/* ── Card 1: Personal Info ── */}
          <div className="form-card">
            <h5>👤 Personal Information</h5>
            <div className="row g-3">
              <div className="col-md-6">
                <label className="form-label">First Name <span className="required-star">*</span></label>
                <input className={`form-control ${errors.firstName ? "is-invalid" : ""}`}
                  name="firstName" value={form.firstName} onChange={handleChange} placeholder="Jane"/>
                {errors.firstName && <div className="field-error">{errors.firstName}</div>}
              </div>
              <div className="col-md-6">
                <label className="form-label">Last Name <span className="required-star">*</span></label>
                <input className={`form-control ${errors.lastName ? "is-invalid" : ""}`}
                  name="lastName" value={form.lastName} onChange={handleChange} placeholder="Smith"/>
                {errors.lastName && <div className="field-error">{errors.lastName}</div>}
              </div>
              <div className="col-md-6">
                <label className="form-label">Email Address <span className="required-star">*</span></label>
                <input className={`form-control ${errors.email ? "is-invalid" : ""}`}
                  type="email" name="email" value={form.email} onChange={handleChange} placeholder="jane@example.com"/>
                {errors.email && <div className="field-error">{errors.email}</div>}
              </div>
              <div className="col-md-6">
                <label className="form-label">Phone Number <span style={{color:"#888",fontSize:"0.8rem"}}>(optional)</span></label>
                <input className={`form-control ${errors.phone ? "is-invalid" : ""}`}
                  name="phone" value={form.phone} onChange={handleChange} placeholder="+1 555-000-0000"/>
                {errors.phone && <div className="field-error">{errors.phone}</div>}
              </div>
              <div className="col-12">
                <label className="form-label">Company / Organization <span style={{color:"#888",fontSize:"0.8rem"}}>(optional)</span></label>
                <input className="form-control"
                  name="company" value={form.company} onChange={handleChange} placeholder="Acme Corp"/>
              </div>
            </div>
          </div>

          {/* ── Card 2: Participation Type ── */}
          <div className="form-card">
            <h5>🎟️ Participation Type <span className="required-star">*</span></h5>
            <div className="row g-3 justify-content-center">
              {[
                { val:"in-person", label:"In-Person",  desc:"Attend on-site in Philadelphia, PA",   icon:"🏛️" },
                { val:"virtual",   label:"Virtual",    desc:"Join via live stream from anywhere",    icon:"💻" },
                { val:"vip",       label:"VIP",        desc:"Full access + exclusive VIP lounge",   icon:"⭐" },
              ].map(opt => (
                <div className="col-md-4" key={opt.val}>
                  <div
                    onClick={() => { setForm(p=>({...p,participationType:opt.val})); setErrors(p=>({...p,participationType:""})); }}
                    style={{
                      border: `2px solid ${form.participationType===opt.val ? "cornflowerblue" : "#ddd"}`,
                      background: form.participationType===opt.val ? "#eef3ff" : "white",
                      borderRadius:8, padding:"18px 14px", cursor:"pointer", transition:"all 0.2s", textAlign:"center"
                    }}>
                    <div style={{fontSize:"2rem"}}>{opt.icon}</div>
                    <div style={{fontWeight:700}}>{opt.label}</div>
                    <div style={{fontSize:"0.8rem",color:"#666",marginTop:4}}>{opt.desc}</div>
                    <input type="radio" name="participationType" value={opt.val}
                      checked={form.participationType===opt.val}
                      onChange={handleChange} style={{marginTop:8}}/>
                  </div>
                </div>
              ))}
            </div>
            {errors.participationType && <div className="field-error mt-2">{errors.participationType}</div>}
          </div>

          {/* ── Card 3: Sessions ── */}
          <div className="form-card">
            <h5>📅 Select Sessions <span className="required-star">*</span></h5>
            <p style={{fontSize:"0.87rem",color:"#666",marginBottom:16}}>
              Choose one or more sessions to attend. {form.sessions.length > 0 && <strong>({form.sessions.length} selected)</strong>}
            </p>
            <div className="session-grid">
              {sessionData.map(s => (
                <div key={s.id}
                  className={`session-card ${form.sessions.includes(s.id) ? "selected" : ""}`}
                  onClick={() => toggleSession(s.id)}>
                  <input type="checkbox" checked={form.sessions.includes(s.id)} onChange={()=>toggleSession(s.id)}/>
                  <span className="s-title">{s.title}</span>
                  <div className="s-meta">{s.time} · {s.track} · {s.room}</div>
                </div>
              ))}
            </div>
            {errors.sessions && <div className="field-error mt-2">{errors.sessions}</div>}
          </div>

          {/* ── Card 4: Additional Options ── */}
          <div className="form-card">
            <h5>🛠️ Additional Options</h5>
            <div className="row g-3">
              <div className="col-md-4">
                <label className="form-label">T-Shirt Size <span className="required-star">*</span></label>
                <select className={`form-select ${errors.shirtSize ? "is-invalid" : ""}`}
                  name="shirtSize" value={form.shirtSize} onChange={handleChange}>
                  <option value="">-- Select size --</option>
                  {["XS","S","M","L","XL","XXL","XXXL"].map(sz=>(
                    <option key={sz} value={sz}>{sz}</option>
                  ))}
                </select>
                {errors.shirtSize && <div className="field-error">{errors.shirtSize}</div>}
              </div>
              <div className="col-md-8">
                <label className="form-label">Dietary Needs <span style={{color:"#888",fontSize:"0.8rem"}}>(optional)</span></label>
                <input className="form-control" name="dietaryNeeds" value={form.dietaryNeeds}
                  onChange={handleChange} placeholder="e.g. Vegetarian, Gluten-free, Kosher"/>
              </div>
              <div className="col-12">
                <label className="form-label">Accessibility / Special Needs <span style={{color:"#888",fontSize:"0.8rem"}}>(optional)</span></label>
                <textarea className="form-control" name="accessibilityNeeds" value={form.accessibilityNeeds}
                  onChange={handleChange} rows={2}
                  placeholder="Let us know if you need any accommodations (wheelchair access, sign language interpreter, etc.)"/>
              </div>
            </div>
          </div>

          {/* ── Card 5: Terms & Submit ── */}
          <div className="form-card">
            <h5>✅ Confirm &amp; Submit</h5>
            <div className="form-check mb-3" style={{textAlign:"left"}}>
              <input className="form-check-input" type="checkbox" id="agreeTerms"
                name="agreeTerms" checked={form.agreeTerms} onChange={handleChange}/>
              <label className="form-check-label" htmlFor="agreeTerms">
                I agree to the TechConf 2025 <a href="#" style={{color:"cornflowerblue"}}>Terms & Conditions</a> and
                understand that registration is confirmed upon submission.
              </label>
              {errors.agreeTerms && <div className="field-error">{errors.agreeTerms}</div>}
            </div>

            <div style={{textAlign:"center",marginTop:8}}>
              <button className="btn-primary-site" onClick={handleSubmit}>
                🚀 Submit Registration
              </button>
              <button className="btn-reset-site" onClick={handleReset}>
                Reset
              </button>
            </div>

            {ajaxMsg.text && (
              <div className={`ajax-status ${ajaxMsg.cls}`} style={{textAlign:"center"}}>
                {ajaxMsg.text}
              </div>
            )}
          </div>

          
          
        </div>
      );
    }

    // ── Mount React app ──
    const root = ReactDOM.createRoot(document.getElementById("react-root"));
    root.render(<App />);
  </script>

</body>
</html>
