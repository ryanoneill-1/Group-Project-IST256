<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Club Portal - Registration Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light">

<div class="container py-4">
    <h1 class="text-center mb-2">Student Club Portal</h1>
    <p class="text-center text-muted mb-4">Browse events and add them to your cart.</p>

    <div class="row">
        <div class="col-md-7">
            <h2 class="mb-3">Browse Events</h2>
            <div class="card p-3 mb-4">
                <label for="search" class="form-label"><strong>Search Events:</strong></label>
                <input type="text" id="search" class="form-control" placeholder="Type to search events...">
            </div>
            <div id="eventList"></div>
        </div>

        <div class="col-md-5">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h2 class="h3 mb-0">Your Cart</h2>
                </div>
                <div class="card-body">
                    <div id="cartItems"></div>
                    <hr>
                    <button id="checkoutBtn" class="btn btn-success w-100 mt-3">Register</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let events = JSON.parse(localStorage.getItem("events")) || [];
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function renderEvents(list) {
    $("#eventList").empty();

    if (list.length === 0) {
        $("#eventList").html(`<div class="alert alert-warning">No events found.</div>`);
        return;
    }

    list.forEach((item) => {
        $("#eventList").append(`
            <div class="card p-3 mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h4>${item.title}</h4>
                        <p class="mb-1"><strong>Category:</strong> ${item.category}</p>
                        <p class="mb-1"><strong>Length:</strong> ${item.duration}</p>
                        <p class="mb-1"><strong>Location:</strong> ${item.location || "—"}</p>
                        <p class="mb-0"><strong>Host:</strong> ${item.host || "—"}</p>
                    </div>
                    <div>
                        <button class="btn btn-primary mt-2" onclick="addToCart(${item.id})">
                            Add to Cart
                        </button>
                    </div>
                </div>
            </div>
        `);
    });
}

function renderCart() {
    $("#cartItems").empty();

    if (cart.length === 0) {
        $("#cartItems").html("<p>Your cart is empty.</p>");
        return;
    }

    cart.forEach((item, index) => {
        $("#cartItems").append(`
            <div class="mb-3 border-bottom pb-2">
                <div class="d-flex justify-content-between">
                    <div>
                        <strong>${item.title}</strong><br>
                        <span>${item.category}</span>
                    </div>
                    <button class="btn btn-danger btn-sm" onclick="removeFromCart(${index})">
                        Remove
                    </button>
                </div>
            </div>
        `);
    });
}

function addToCart(id) {
    const selectedEvent = events.find(item => item.id === id);
    if (!selectedEvent) return;
    const alreadyInCart = cart.some(item => item.id === id);
    if (alreadyInCart) {
        alert("This event is already in your cart.");
        return;
    }

    cart.push(selectedEvent);
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
}

function removeFromCart(index) {
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
}

$(document).ready(function () {
    renderEvents(events);
    renderCart();

    $("#search").on("keyup", function () {
        let value = $(this).val().toLowerCase();
        let filtered = events.filter(item =>
            item.title.toLowerCase().includes(value) ||
            item.category.toLowerCase().includes(value) ||
            (item.location && item.location.toLowerCase().includes(value)) ||
            (item.host && item.host.toLowerCase().includes(value))
        );
        renderEvents(filtered);
    });
    $("#checkoutBtn").click(function () {
        if (cart.length === 0) {
            alert("Your cart is empty.");
            return;
        }
        alert("Registration submitted successfully!");
        cart = [];
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
    });
});
</script>
</body>
</html>
